    <!DOCTYPE html>  
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
     <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7174828243666618"
     crossorigin="anonymous"></script>
<title>استماع القرآن الكريم — جميع القراء</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0e2224;
    --panel: #143336;
    --panel-2: #1a3f42;
    --gold: #d4af6a;
    --gold-dim: #a9885280;
    --text: #f4ede0;
    --muted: #8fada6;
    --line: #24494c;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: radial-gradient(ellipse at top, #163c3f 0%, var(--bg) 55%);
    color:var(--text);
    font-family:'Tajawal',sans-serif;
    min-height:100vh;
    padding-bottom:120px;
  }
  header{padding:38px 20px 26px;text-align:center;border-bottom:1px solid var(--line);}
  header h1{
    font-family:'Amiri',serif;font-weight:700;
    font-size:clamp(28px,5vw,42px);margin:0 0 6px;color:var(--gold);
  }
  header p{margin:0;color:var(--muted);font-size:15px;}

  .controls{max-width:820px;margin:26px auto 10px;padding:0 18px;display:flex;flex-direction:column;gap:14px;}
  .field{display:flex;flex-direction:column;gap:6px;}
  .field label{font-size:13px;color:var(--muted);}
  select, input[type="text"]{
    background:var(--panel);border:1px solid var(--line);color:var(--text);
    padding:12px 14px;border-radius:10px;font-family:'Tajawal',sans-serif;font-size:15px;outline:none;
  }
  select:focus, input[type="text"]:focus{border-color:var(--gold-dim);}
  .riwaya-row{display:flex;flex-wrap:wrap;gap:8px;}
  .riwaya-row button{
    background:var(--panel);border:1px solid var(--line);color:var(--muted);
    padding:8px 16px;border-radius:999px;cursor:pointer;
    font-family:'Tajawal',sans-serif;font-size:14px;transition:border-color .2s, color .2s;
  }
  .riwaya-row button.active{border-color:var(--gold);color:var(--gold);}

  .status{max-width:820px;margin:16px auto;padding:0 18px;color:var(--muted);font-size:14px;min-height:20px;}

  .surah-grid{
    max-width:820px;margin:10px auto 0;padding:0 18px 20px;
    display:grid;grid-template-columns:repeat(auto-fill, minmax(170px,1fr));gap:10px;
  }
  .surah-card{
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:12px 14px;cursor:pointer;display:flex;align-items:center;gap:10px;
    transition:background .15s, border-color .15s;text-align:right;
  }
  .surah-card:hover{border-color:var(--gold-dim);}
  .surah-card.playing{background:var(--panel-2);border-color:var(--gold);animation:pulse 1.8s ease-in-out infinite;}
  @keyframes pulse{
    0%,100%{ box-shadow:0 0 0 0 rgba(212,175,106,0.0); }
    50%{ box-shadow:0 0 0 4px rgba(212,175,106,0.12); }
  }
  .surah-card.unavailable{opacity:.35;cursor:not-allowed;}
  .surah-num{
    font-family:'Amiri',serif;color:var(--gold);font-size:14px;min-width:26px;
    text-align:center;border-left:1px solid var(--line);padding-left:8px;
  }
  .surah-name{font-size:15px;flex:1;}

  /* أزرار التحميل */
  .dl-btn{
    background:none;border:1px solid var(--line);color:var(--gold);
    width:32px;height:32px;border-radius:8px;cursor:pointer;
    font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center;
    flex-shrink:0;transition:background .15s, border-color .15s;
  }
  .dl-btn:hover{background:var(--panel-2);border-color:var(--gold);}
  .dl-btn:disabled{opacity:.5;cursor:wait;}

  .player-bar{
    position:fixed;bottom:0;right:0;left:0;background:#0b1c1e;
    border-top:1px solid var(--line);padding:12px 18px;
    padding-bottom:calc(12px + env(safe-area-inset-bottom, 0px));
    display:flex;flex-direction:column;gap:8px;
  }
  .player-info{display:flex;justify-content:space-between;align-items:center;font-size:14px;gap:10px;}
  .player-info .now-playing{color:var(--gold);font-family:'Amiri',serif;}
  .player-info .reciter-name{color:var(--muted);font-size:13px;}
  .player-controls{display:flex;align-items:center;gap:10px;}
  .player-controls button.nav{
    background:none;border:none;color:var(--text);font-size:20px;cursor:pointer;padding:4px 8px;
  }
  audio{flex:1;height:34px;min-width:0;}
  #dl-progress{
    height:3px;background:var(--line);border-radius:3px;overflow:hidden;display:none;
  }
  #dl-progress div{height:100%;width:0;background:var(--gold);transition:width .15s;}

  ::selection{ background:var(--gold-dim); }
  @media (prefers-reduced-motion: reduce){ .surah-card.playing{ animation:none; } }
</style>
</head>
<body>

<header>
  <h1>استماع القرآن الكريم</h1>
  <p>اختر القارئ والرواية، ثم اختر السورة للاستماع إليها أو تحميلها</p>
</header>

<div class="controls">
  <div class="field">
    <label for="reciter-search">ابحث عن قارئ</label>
    <input type="text" id="reciter-search" placeholder="اكتب اسم القارئ...">
  </div>
  <div class="field">
    <label for="reciter-select">القارئ (<span id="reciter-count">...</span>)</label>
    <select id="reciter-select"></select>
  </div>
  <div class="field" id="riwaya-field" style="display:none;">
    <label>الرواية</label>
    <div class="riwaya-row" id="riwaya-row"></div>
  </div>
</div>

<div class="status" id="status">جارٍ تحميل قائمة القراء...</div>

<div class="surah-grid" id="surah-grid"></div>

<div class="player-bar">
  <div class="player-info">
    <span class="now-playing" id="now-playing">لم يتم اختيار سورة بعد</span>
    <span class="reciter-name" id="now-reciter"></span>
  </div>
  <div class="player-controls">
    <button class="nav" id="prev-btn" title="السورة السابقة">⟩⟩</button>
    <audio id="audio-player" controls></audio>
    <button class="nav" id="next-btn" title="السورة التالية">⟨⟨</button>
    <button class="dl-btn" id="player-dl" title="تحميل السورة الحالية" disabled>⬇</button>
  </div>
  <div id="dl-progress"><div></div></div>
</div>

<script>
const SURAH_NAMES = [
"الفاتحة","البقرة","آل عمران","النساء","المائدة","الأنعام","الأعراف","الأنفال","التوبة","يونس",
"هود","يوسف","الرعد","إبراهيم","الحجر","النحل","الإسراء","الكهف","مريم","طه",
"الأنبياء","الحج","المؤمنون","النور","الفرقان","الشعراء","النمل","القصص","العنكبوت","الروم",
"لقمان","السجدة","الأحزاب","سبأ","فاطر","يس","الصافات","ص","الزمر","غافر",
"فصلت","الشورى","الزخرف","الدخان","الجاثية","الأحقاف","محمد","الفتح","الحجرات","ق",
"الذاريات","الطور","النجم","القمر","الرحمن","الواقعة","الحديد","المجادلة","الحشر","الممتحنة",
"الصف","الجمعة","المنافقون","التغابن","الطلاق","التحريم","الملك","القلم","الحاقة","المعارج",
"نوح","الجن","المزمل","المدثر","القيامة","الإنسان","المرسلات","النبأ","النازعات","عبس",
"التكوير","الانفطار","المطففين","الانشقاق","البروج","الطارق","الأعلى","الغاشية","الفجر","البلد",
"الشمس","الليل","الضحى","الشرح","التين","العلق","القدر","البينة","الزلزلة","العاديات",
"القارعة","التكاثر","العصر","الهمزة","الفيل","قريش","الماعون","الكوثر","الكافرون","النصر",
"المسد","الإخلاص","الفلق","الناس"
];

let reciters = [];
let currentReciter = null;
let currentMoshaf = null;
let currentSurahList = [];
let currentSurahIndex = -1;
let currentPlaying = null; // {url, filename}
let downloading = false;

const statusEl = document.getElementById('status');
const searchEl = document.getElementById('reciter-search');
const selectEl = document.getElementById('reciter-select');
const riwayaField = document.getElementById('riwaya-field');
const riwayaRow = document.getElementById('riwaya-row');
const gridEl = document.getElementById('surah-grid');
const audioEl = document.getElementById('audio-player');
const nowPlayingEl = document.getElementById('now-playing');
const nowReciterEl = document.getElementById('now-reciter');
const countEl = document.getElementById('reciter-count');
const playerDlBtn = document.getElementById('player-dl');
const progEl = document.getElementById('dl-progress');
const progBar = progEl.firstElementChild;

async function loadReciters(){
  try{
    const res = await fetch('https://mp3quran.net/api/v3/reciters?language=ar');
    const data = await res.json();
    reciters = (data.reciters || []).slice();
    reciters.sort((a, b) => a.name.localeCompare(b.name, 'ar'));
    countEl.textContent = reciters.length;
    populateReciterSelect(reciters);
    statusEl.textContent = `تم تحميل ${reciters.length} قارئًا (جميع القراء المتوفرين في القاعدة). اختر قارئًا للبدء.`;
    if(reciters.length){
      selectEl.value = 0;
      onReciterChange();
    }
  }catch(err){
    statusEl.textContent = 'تعذّر تحميل قائمة القراء. تحقق من الاتصال بالإنترنت وأعد تحميل الصفحة.';
  }
}

function populateReciterSelect(list){
  selectEl.innerHTML = '';
  list.forEach((r)=>{
    const opt = document.createElement('option');
    opt.value = reciters.indexOf(r);
    opt.textContent = r.name;
    selectEl.appendChild(opt);
  });
}

searchEl.addEventListener('input', ()=>{
  const q = searchEl.value.trim();
  const filtered = q ? reciters.filter(r => r.name.includes(q)) : reciters;
  populateReciterSelect(filtered);
  countEl.textContent = `${filtered.length} من ${reciters.length}`;
  if(filtered.length){
    selectEl.value = reciters.indexOf(filtered[0]);
    onReciterChange();
  }else{
    riwayaField.style.display = 'none';
    gridEl.innerHTML = '';
    statusEl.textContent = 'لا توجد نتائج مطابقة.';
  }
});

selectEl.addEventListener('change', onReciterChange);

function onReciterChange(){
  const idx = parseInt(selectEl.value, 10);
  currentReciter = reciters[idx];
  if(!currentReciter) return;
  const moshafs = currentReciter.moshaf || [];
  riwayaRow.innerHTML = '';
  if(moshafs.length > 1){
    riwayaField.style.display = 'flex';
    moshafs.forEach((m, i)=>{
      const btn = document.createElement('button');
      btn.textContent = m.name;
      btn.className = i === 0 ? 'active' : '';
      btn.addEventListener('click', ()=>{
        [...riwayaRow.children].forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        setMoshaf(m);
      });
      riwayaRow.appendChild(btn);
    });
  }else{
    riwayaField.style.display = 'none';
  }
  if(moshafs.length){
    setMoshaf(moshafs[0]);
  }else{
    gridEl.innerHTML = '';
    statusEl.textContent = 'لا توجد تلاوات متاحة لهذا القارئ حاليًا.';
  }
}

function setMoshaf(moshaf){
  currentMoshaf = moshaf;
  currentSurahList = (moshaf.surah_list || '').split(',').map(n => parseInt(n,10)).filter(Boolean);
  renderGrid();
  statusEl.textContent = `${currentReciter.name} — ${moshaf.name} (${currentSurahList.length} سورة متاحة)`;
}

function renderGrid(){
  gridEl.innerHTML = '';
  for(let n = 1; n <= 114; n++){
    const available = currentSurahList.includes(n);
    const card = document.createElement('div');
    card.className = 'surah-card' + (available ? '' : ' unavailable');
    card.dataset.surah = n;
    card.innerHTML = `<span class="surah-num">${n}</span><span class="surah-name">${SURAH_NAMES[n-1]}</span>`;
    if(available){
      card.addEventListener('click', ()=> playSurah(n));
      const dl = document.createElement('button');
      dl.className = 'dl-btn';
      dl.title = 'تحميل السورة';
      dl.textContent = '⬇';
      dl.addEventListener('click', (e)=>{
        e.stopPropagation();
        downloadFile(surahUrl(n), fileName(n), dl);
      });
      card.appendChild(dl);
    }
    gridEl.appendChild(card);
  }
}

function surahUrl(n){
  const padded = String(n).padStart(3,'0');
  return currentMoshaf.server + padded + '.mp3';
}

function fileName(n){
  const num = String(n).padStart(3,'0');
  return `${num} - ${SURAH_NAMES[n-1]} - ${currentReciter.name}.mp3`.replace(/[\\/:*?"<>|]/g,'');
}

function playSurah(n){
  currentSurahIndex = currentSurahList.indexOf(n);
  const url = surahUrl(n);
  currentPlaying = { url, filename: fileName(n) };
  playerDlBtn.disabled = false;
  audioEl.src = url;
  audioEl.play().catch(()=>{
    statusEl.textContent = 'تعذّر تشغيل هذه السورة لهذا القارئ. جرّب سورة أخرى.';
  });
  nowPlayingEl.textContent = `سورة ${SURAH_NAMES[n-1]}`;
  nowReciterEl.textContent = `${currentReciter.name} — ${currentMoshaf.name}`;
  [...gridEl.children].forEach(c => c.classList.toggle('playing', parseInt(c.dataset.surah,10) === n));
}

/* ===== التحميل ===== */
function saveBlob(blob, filename){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=> URL.revokeObjectURL(a.href), 4000);
}

function fallbackDownload(url, filename){
  // إذا منع الخادم التحميل المباشر، نفتح الرابط في تبويب جديد (يمكن الحفظ منه)
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.target = '_blank';
  a.rel = 'noopener';
  document.body.appendChild(a);
  a.click();
  a.remove();
}

async function downloadFile(url, filename, btn){
  if(downloading){
    statusEl.textContent = 'هناك تحميل جارٍ بالفعل، انتظر حتى ينتهي.';
    return;
  }
  downloading = true;
  const oldText = btn ? btn.textContent : '';
  if(btn){ btn.disabled = true; btn.textContent = '…'; }
  playerDlBtn.disabled = true;
  progEl.style.display = 'block';
  progBar.style.width = '0%';
  statusEl.textContent = `جارٍ تحميل: ${filename}`;
  try{
    const res = await fetch(url);
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const total = parseInt(res.headers.get('content-length') || '0', 10);
    let blob;
    if(res.body && total){
      const reader = res.body.getReader();
      const chunks = [];
      let received = 0;
      while(true){
        const {done, value} = await reader.read();
        if(done) break;
        chunks.push(value);
        received += value.length;
        const pct = Math.round(received / total * 100);
        progBar.style.width = pct + '%';
        statusEl.textContent = `جارٍ تحميل: ${filename} — ${pct}%`;
      }
      blob = new Blob(chunks, {type:'audio/mpeg'});
    }else{
      blob = await res.blob();
    }
    progBar.style.width = '100%';
    saveBlob(blob, filename);
    statusEl.textContent = `تم تحميل: ${filename}`;
  }catch(err){
    // في حال عدم السماح بالتحميل المباشر (CORS) نستخدم الطريقة البديلة
    fallbackDownload(url, filename);
    statusEl.textContent = 'تم فتح الملف في تبويب جديد، يمكنك حفظه من هناك إن لم يبدأ التحميل تلقائيًا.';
  }finally{
    downloading = false;
    if(btn){ btn.disabled = false; btn.textContent = oldText; }
    playerDlBtn.disabled = !currentPlaying;
    setTimeout(()=>{ progEl.style.display = 'none'; }, 1200);
  }
}

playerDlBtn.addEventListener('click', ()=>{
  if(currentPlaying) downloadFile(currentPlaying.url, currentPlaying.filename, playerDlBtn);
});

document.getElementById('next-btn').addEventListener('click', ()=>{
  if(currentSurahIndex < currentSurahList.length - 1){
    playSurah(currentSurahList[currentSurahIndex + 1]);
  }
});
document.getElementById('prev-btn').addEventListener('click', ()=>{
  if(currentSurahIndex > 0){
    playSurah(currentSurahList[currentSurahIndex - 1]);
  }
});
audioEl.addEventListener('ended', ()=>{
  if(currentSurahIndex < currentSurahList.length - 1){
    playSurah(currentSurahList[currentSurahIndex + 1]);
  }
});

loadReciters();
</script>

</body>
</html>
